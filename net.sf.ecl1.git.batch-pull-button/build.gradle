plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation(project(':h1modules.utilities'))
    implementation libs.eclipse.jdt.core
    implementation libs.eclipse.core.resources
    implementation libs.eclipse.core.commands
    compileOnly (libs.eclipse.swt.win32) {
        transitive = false
    }
    implementation (libs.eclipse.jface) {
        transitive = false
    }
    implementation (libs.eclipse.ui.workbench) {
        transitive = false
    }
    implementation libs.eclipse.jgit
    implementation libs.slf4j.nop // standalone, provides a StaticLoggerBinder required by JGit
    implementation libs.gson
    implementation libs.httpclient
}

sourceSets {
    main {
        java {
            srcDir 'src'
        }
    }
}


application {
    mainClass = 'net.sf.ecl1.git.standalone.GitBatchPullApp'
}
